<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAEMON 504 | Guardianes del Umbral</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <header class="cabecera">
        <h1>DAEMON 504</h1>
        <p>Guardianes del Umbral</p>
    </header>

    <nav id="barra-nav" class="barra-nav" aria-label="Navegación principal">
        <button type="button" data-vista="vista-exploracion">Explorar</button>
        <button type="button" data-vista="vista-equipo">Equipo</button>
        <button type="button" data-vista="vista-inventario">Inventario</button>
    </nav>

    <main>
        <!-- Cada integrante llena SU sección. No cambiar los ids (ver README). -->


            <section id="vista-acceso" class="vista">
                <h2>Acceso</h2>
                <p>Inicia sesión o crea una cuenta para comenzar tu aventura.</p>

                <form id="form-acceso" novalidate>
                    <div class="campo">
                        <label for="acceso-correo">Correo electrónico</label>
                        <input id="acceso-correo" name="correo" type="email" autocomplete="email" required>
                    </div>
                    <div class="campo">
                        <label for="acceso-clave">Contraseña</label>
                        <input id="acceso-clave" name="clave" type="password" autocomplete="current-password" minlength="6" required>
                    </div>
                    <div class="acciones">
                        <button type="submit" id="btn-iniciar">Iniciar sesión</button>
                        <button type="button" id="btn-registrar">Registrarse</button>
                    </div>
                </form>
                <p id="acceso-mensaje" role="alert"></p>
            </section>
        


        <section id="vista-personaje" class="vista oculta">
            <h2>Creación de personaje</h2>
            <p>Elige el nombre de tu aprendiz guardián y a tu primer daemon.</p>

            <form id="form-personaje" novalidate>
                <div class="campo">
                    <label for="personaje-nombre">Nombre del personaje</label>
                    <input id="personaje-nombre" name="nombre" type="text" minlength="3" maxlength="20" required>
                </div>

                <fieldset class="iniciales">
                    <legend>Daemon inicial</legend>
                    <div id="tarjetas-iniciales" class="tarjetas"></div>
                </fieldset>

                <div class="acciones">
                    <button type="submit">Comenzar aventura</button>
                </div>
            </form>
            <p id="personaje-mensaje" role="alert"></p>
        </section>
        </section>

        <section id="vista-exploracion" class="vista oculta">
            <h2>Exploración</h2>
            <!-- TODO: zona actual, destinos, botón Explorar, historial -->
        </section>

        <section id="vista-combate" class="vista oculta">
            <h2>Combate</h2>
            <!-- TODO: daemon propio y rival, barras de salud, acciones -->
        </section>

        <section id="vista-equipo" class="vista oculta">
            <h2>Equipo</h2>
            <!-- TODO: hasta 6 tarjetas y reserva -->
        </section>

        <section id="vista-inventario" class="vista oculta">
            <h2>Inventario</h2>
            <!-- TODO: objetos, cantidades y uso -->
        </section>
    </main>

    <footer class="pie">
        <p>ISC-305 · Programación Web · III PAC 2026</p>
    </footer>

    <!-- Orden de carga: datos y lógica primero, app.js al final -->
    <script src="js/estado.js"></script>
    <script src="js/api.js"></script>
    <script src="js/vistas/acceso.js"></script>
    <script src="js/vistas/personaje.js"></script>
    <script src="js/vistas/exploracion.js"></script>
    <script src="js/vistas/combate.js"></script>
    <script src="js/vistas/equipo.js"></script>
    <script src="js/vistas/inventario.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
